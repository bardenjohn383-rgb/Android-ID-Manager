
name: Android ID Manager Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Fix Android 37 SDK directory
        run: |
          cd "$ANDROID_HOME/platforms"
          if [ ! -e android-37 ] && [ -d android-37.0 ]; then
            ln -s android-37.0 android-37
          fi
          ls -la

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Extract source project
        run: |
          unzip -q AndroidIDManager_Source.zip -d source

      - name: Build Debug APK
        run: |
          gradle -p source/AndroidIDManager assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ID-Manager-APK
          path: source/AndroidIDManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
