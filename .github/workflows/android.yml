name: Android ID Manager Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \\
            "platforms;android-37.0" \\
            "build-tools;36.0.0"

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Extract Source Project
        run: |
          test -f AndroidIDManager_Source.zip
          unzip -q AndroidIDManager_Source.zip -d source

          test -f source/AndroidIDManager/build.gradle.kts
          test -f source/AndroidIDManager/app/build.gradle.kts

      - name: Verify Kotlin Configuration
        run: |
          ! grep -R "org.jetbrains.kotlin.android" \\
            source/AndroidIDManager/*.gradle.kts \\
            source/AndroidIDManager/app/*.gradle.kts

      - name: Build Debug APK
        run: |
          gradle -p source/AndroidIDManager \\
            assembleDebug \\
            --no-daemon \\
            --stacktrace

      - name: Verify APK
        run: |
          APK="source/AndroidIDManager/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ID-Manager-APK
          path: source/AndroidIDManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
