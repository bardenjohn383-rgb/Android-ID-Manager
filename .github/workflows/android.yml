
name: Android ID Manager Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Extract source project
        run: |
          unzip -q AndroidIDManager_Source.zip -d source

      - name: Build Debug APK
        run: |
          gradle -p source/AndroidIDManager assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ID-Manager-APK
          path: source/AndroidIDManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
